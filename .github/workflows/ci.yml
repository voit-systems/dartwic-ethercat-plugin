name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-full-stack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build nlohmann-json3-dev libtinyxml2-dev
      - name: Build KickCAT C bridge
        run: |
          cmake -S bridge -B build/bridge -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/bridge
      - name: Build plugin and tests
        run: |
          cmake -S . -B build/plugin -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/plugin
      - name: Test codec, C ABI, and bridge cadence at 1 kHz
        run: |
          ctest --test-dir build/plugin --output-on-failure
          build/plugin/ethercat_rate_test --bridge build/plugin/tests/libdartwic_ethercat_bridge_fake.so --adapter fake --cycles 3000 --period-us 1000
      - name: Build and verify interface plugin
        run: |
          npm ci
          npm run build:interface
          npm run verify

  windows-plugin:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure and build DARTWIC side
        run: |
          cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/msvc --config Release --parallel
      - name: Test Windows C ABI and throughput
        run: ctest --test-dir build/msvc -C Release --output-on-failure
      - name: Verify standalone source
        run: |
          npm ci
          npm run build:interface
          npm run verify

  windows-kickcat-bridge:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-pip
      - name: Install Conan
        shell: msys2 {0}
        run: |
          python -m pip install "conan==2.32.0"
          conan profile detect --force
      - name: Install MinGW bridge dependencies with Conan
        shell: msys2 {0}
        run: |
          conan install bridge/conanfile.txt \
            --output-folder=build/bridge-conan \
            --build=missing \
            --profile:host=bridge/profiles/mingw-ucrt64 \
            --profile:build=default
      - name: Build the Windows KickCAT C bridge
        shell: msys2 {0}
        run: |
          cmake -S bridge -B build/bridge-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/bridge-conan/conan_toolchain.cmake"
          cmake --build build/bridge-windows
          test -f build/bridge-windows/dartwic_ethercat_bridge.dll
          bridge_dependencies="$(ldd build/bridge-windows/dartwic_ethercat_bridge.dll)"
          printf '%s\n' "$bridge_dependencies"
          if grep -qi 'libstdc\|libgcc\|libwinpthread' <<< "$bridge_dependencies"; then
            echo "MinGW runtime DLLs must be linked statically"
            exit 1
          fi
